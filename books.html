<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبریری | ADIL WARIA</title>
    <style>
        :root { --primary-green: #0a3d2e; --accent-gold: #c5a059; }
        body { font-family: sans-serif; margin: 0; background-color: #f4f4f4; }
        header { background: var(--primary-green); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-gold); color: white; }
        .logo { font-weight: bold; font-size: 20px; }
        .hero { background: var(--primary-green); color: white; padding: 30px 5%; text-align: center; }
        .search-container { padding: 20px 5%; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 5%; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .btn-div { display: flex; gap: 5px; margin-top: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .read { background: #0a3d2e; }
        .down { background: #c5a059; }
    </style>
</head>
<body>

<header>
    <div class="logo">🏠 ADIL WARIA</div>
    <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">ہوم پیج</a>
</header>

<section class="hero"><h1 id="cat-title">لائبریری</h1></section>

<section class="search-container">
    <input type="text" id="searchInput" onkeyup="searchBooks()" placeholder="کتاب تلاش کریں...">
</section>

<div class="grid" id="book-grid"></div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyi2ilqitOxTHkwWAcYU0Wrc-xhzwSgZvJk8JZy_-6N40xnRFkvZk8uVHACePzS7opI/exec';

    async function loadBooks() {
        const params = new URLSearchParams(window.location.search);
        const cat = params.get('cat');
        const level = params.get('level');
        const type = params.get('type');
        
        document.getElementById('cat-title').innerText = cat || "لائبریری";

        let res = await fetch(scriptURL);
        let data = await res.json();
        let grid = document.getElementById('book-grid');
        grid.innerHTML = '';

        for (let i = 1; i < data.length; i++) {
            let row = data[i];
            // B=row[1], C=row[2], G=row[6], F=row[5], H=row[7], I=row[8], J=row[9], K=row[10]
            if (row[1] === cat && (!level || row[2] === level) && (!type || row[6] === type)) {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${row[10]}" onerror="this.src='https://via.placeholder.com/150'">
                        <h5>${row[5]}</h5>
                        <div class="btn-div">
                            <button class="btn read" onclick="window.open('${row[8]}')">پڑھنا</button>
                            <button class="btn down" onclick="window.open('${row[9]}')">ڈاؤن لوڈ</button>
                        </div>
                    </div>`;
            }
        }
    }
    loadBooks();
    function searchBooks() { /* تلاش کا فنکشن برقرار ہے */ }
</script>
</body>
</html>
