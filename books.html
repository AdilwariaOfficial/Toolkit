<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبریری | ADIL WARIA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --primary-green: #0a3d2e; --accent-gold: #c5a059; --bg-light: #f4f4f4; --bg-dark: #121212; --card-light: #ffffff; --card-dark: #1e1e1e; --text-light: #333; --text-dark: #eee; }
        body.dark-mode { background-color: var(--bg-dark); color: var(--text-dark); }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-light); color: var(--text-light); transition: 0.3s; }
        header { background: var(--primary-green); padding: 15px 5%; color: white; border-bottom: 4px solid var(--accent-gold); display: flex; justify-content: space-between; align-items: center; }
        .hero { background: var(--primary-green); color: white; padding: 20px 5%; text-align: center; }
        .search-container { padding: 20px 5%; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px 5%; }
        .book-card { background: var(--card-light); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        body.dark-mode .book-card { background: var(--card-dark); }
        .book-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .btn-group { display: flex; gap: 5px; margin-top: 10px; }
        button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .read { background: #0a3d2e; color: white; }
        .down { background: #c5a059; color: white; }
    </style>
</head>
<body>

<header>
    <div class="logo">🏠 ADIL WARIA</div>
    <button style="width:auto;" onclick="document.body.classList.toggle('dark-mode')">🌙</button>
</header>

<section class="hero"><h2 id="cat-title">لائبریری</h2></section>

<section class="search-container">
    <input type="text" id="searchInput" onkeyup="searchBooks()" placeholder="کتاب تلاش کریں...">
</section>

<div class="grid-container" id="book-grid">
    <p>کتابیں لوڈ ہو رہی ہیں...</p>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyi2ilqitOxTHkwWAcYU0Wrc-xhzwSgZvJk8JZy_-6N40xnRFkvZk8uVHACePzS7opI/exec';

    async function loadBooks() {
        const params = new URLSearchParams(window.location.search);
        const cat = params.get('cat');
        const sub = params.get('sub');
        document.getElementById('cat-title').innerText = cat + (sub ? " - " + sub : "");

        let res = await fetch(scriptURL);
        let data = await res.json();
        let grid = document.getElementById('book-grid');
        grid.innerHTML = '';

        for (let i = 1; i < data.length; i++) {
            let row = data[i];
            // کالم 1: کیٹیگری، کالم 2: سب-کیٹیگری، کالم 5: نام، کالم 7: ریڈ، کالم 8: ڈاؤنلوڈ، کالم 9: تصویر
            if (row[1] === cat && (!sub || row[2] === sub)) {
                grid.innerHTML += `
                    <div class="book-card">
                        <img src="${row[9]}" onerror="this.src='https://via.placeholder.com/150'">
                        <h5>${row[5]}</h5>
                        <div class="btn-group">
                            <button class="read" onclick="window.open('${row[7]}')">پڑھنا</button>
                            <button class="down" onclick="window.open('${row[8]}')">ڈاؤن لوڈ</button>
                        </div>
                    </div>`;
            }
        }
    }

    function searchBooks() {
        let input = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.getElementsByClassName('book-card');
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].getElementsByTagName("h5")[0].innerText;
            cards[i].style.display = title.toUpperCase().indexOf(input) > -1 ? "" : "none";
        }
    }
    loadBooks();
</script>
</body>
</html>
