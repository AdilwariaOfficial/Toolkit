<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبریری | ADIL WARIA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* وہی اسٹائل جو ہوم پیج پر ہے */
        :root { --primary-green: #0a3d2e; --accent-gold: #c5a059; --bg-light: #f4f4f4; --card-light: #ffffff; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-light); }
        header { background: var(--primary-green); padding: 15px 5%; color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-gold); }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px 5%; }
        .card { background: var(--card-light); padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px 5%; }
        .book-card { background: white; padding: 10px; border-radius: 8px; text-align: center; }
        button { cursor: pointer; padding: 8px; border: none; border-radius: 5px; background: var(--accent-gold); color: white; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo">🏠 ADIL WARIA</div>
    <button style="width:auto;" onclick="location.href='index.html'">ہوم پیج</button>
</header>

<section>
    <div class="grid-4">
        <div class="card"><h4>General Library</h4><button onclick="location.href='books.html?cat=جنرل'">Open</button></div>
        <div class="card"><h4>Wifaq-ul-Madaris</h4><button onclick="document.getElementById('wifaq-menu').style.display='block'">Open</button>
            <div id="wifaq-menu" style="display:none;"><select onchange="location.href='books.html?cat='+this.value"><option>درجہ منتخب کریں</option><option value="تجوید">تجوید</option><option value="اولیٰ">اولیٰ</option></select></div>
        </div>
        <div class="card"><h4>All Boards</h4><button onclick="document.getElementById('board-menu').style.display='block'">Open</button>
            <div id="board-menu" style="display:none;"><select onchange="location.href='books.html?cat='+this.value"><option>کلاس منتخب کریں</option><option value="9th">9th</option><option value="10th">10th</option></select></div>
        </div>
        <div class="card"><h4>AIOU</h4><button onclick="document.getElementById('aiou-menu').style.display='block'">Open</button>
            <div id="aiou-menu" style="display:none;"><select onchange="location.href='books.html?cat='+this.value"><option>کورس منتخب کریں</option><option value="BS">BS</option><option value="PhD">PhD</option></select></div>
        </div>
    </div>
</section>

<div class="book-grid" id="book-grid"></div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyi2ilqitOxTHkwWAcYU0Wrc-xhzwSgZvJk8JZy_-6N40xnRFkvZk8uVHACePzS7opI/exec';
    
    async function loadBooks() {
        let cat = new URLSearchParams(window.location.search).get('cat');
        if(!cat) return; // اگر کوئی کیٹیگری سلیکٹ نہیں ہے تو کچھ نہ دکھاؤ
        
        let res = await fetch(scriptURL);
        let data = await res.json();
        let grid = document.getElementById('book-grid');
        
        for (let i = 1; i < data.length; i++) {
            let row = data[i];
            if (cat === "جنرل" || row[1] === cat) {
                grid.innerHTML += `<div class="book-card">
                    <h5>${row[5]}</h5>
                    <button onclick="window.open('${row[7]}')">پڑھنا</button>
                    <button onclick="window.open('${row[8]}')">ڈاؤن لوڈ</button>
                </div>`;
            }
        }
    }
    loadBooks();
</script>
</body>
</html>
