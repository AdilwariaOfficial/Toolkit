<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبریری | ADIL WARIA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ہوم پیج جیسا اسٹائل */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f4f4; color: #333; }
        header { background: #0a3d2e; padding: 15px 5%; color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #c5a059; }
        .hero { background: #0a3d2e; color: white; padding: 40px 5%; text-align: center; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 5%; }
        .book-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .book-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 5px; margin-top: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; }
        .btn-read { background: #0a3d2e; }
        .btn-down { background: #c5a059; }
    </style>
</head>
<body>

<header>
    <div>🏠 ADIL WARIA</div>
    <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">ہوم پیج</a>
</header>

<section class="hero"><h1 id="page-title">کتابیں</h1></section>

<div class="grid-container" id="book-grid">
    <p>کتابیں لوڈ ہو رہی ہیں، انتظار فرمائیں...</p>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyi2ilqitOxTHkwWAcYU0Wrc-xhzwSgZvJk8JZy_-6N40xnRFkvZk8uVHACePzS7opI/exec';

    async function loadBooks() {
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat'); // شعبہ
        const level = urlParams.get('level'); // درجہ
        const type = urlParams.get('type'); // نوعیت
        
        document.getElementById('page-title').innerText = cat || "لائبریری";

        let res = await fetch(scriptURL);
        let data = await res.json();
        let grid = document.getElementById('book-grid');
        grid.innerHTML = '';

        // ڈیٹا کو فلٹر کریں
        for (let i = 1; i < data.length; i++) {
            let row = data[i];
            // row[1]=شعبہ, row[2]=درجہ, row[6]=نوعیت
            if (row[1] === cat && (!level || row[2] === level) && (!type || row[6] === type)) {
                grid.innerHTML += `
                    <div class="book-card">
                        <img src="${row[10]}" onerror="this.src='https://via.placeholder.com/150'">
                        <h5>${row[5]}</h5>
                        <div class="btn-group">
                            <button class="btn btn-read" onclick="window.open('${row[8]}')">پڑھنا</button>
                            <button class="btn btn-down" onclick="window.open('${row[9]}')">ڈاؤن لوڈ</button>
                        </div>
                    </div>`;
            }
        }
    }
    loadBooks();
</script>
</body>
</html>
