<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIL WARIA® | Official</title>
    <style>
        :root { --primary-green: #0a3d2e; --accent-gold: #c5a059; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; }

        /* ہیڈر */
        header { background: var(--primary-green); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-gold); }
        
        /* سیکشنز */
        .section { padding: 20px 5%; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* افقی قطار (کتابوں/ایپس کے لیے) */
        .scroll-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scroll-behavior: smooth; }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        /* کارڈ کا سائز بالکل آپ کی تصویر کے مطابق */
        .card { min-width: 130px; max-width: 130px; background: white; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-bottom: 5px; }
        .card h4 { font-size: 14px; margin: 5px 0; }
        
        /* بٹن سٹائل */
        .btn { width: 100%; padding: 8px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-open { background: var(--accent-gold); color: white; }
        .btn-down { background: var(--primary-green); color: white; }

        /* سی آل بٹن */
        .see-all-container { min-width: 80px; display: flex; align-items: center; justify-content: center; }
        .see-all-btn { background: var(--primary-green); color: white; padding: 10px; border-radius: 50%; text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>

<header>
    <div class="logo" style="font-weight:bold;">ADIL WARIA®</div>
    <div>☰ MENU</div>
</header>

<section class="section">
    <div class="section-header"><h2>لائبریری / Library</h2></div>
    <div class="scroll-container">
        <div class="card"><img src="https://via.placeholder.com/130x150" alt="Book"><h4>جنرل</h4><button class="btn btn-open">اوپن</button></div>
        <div class="card"><img src="https://via.placeholder.com/130x150" alt="Book"><h4>وفاق</h4><button class="btn btn-open">اوپن</button></div>
        <div class="card"><img src="https://via.placeholder.com/130x150" alt="Book"><h4>بورڈز</h4><button class="btn btn-open">اوپن</button></div>
        <div class="card"><img src="https://via.placeholder.com/130x150" alt="Book"><h4>یونیورسٹی</h4><button class="btn btn-open">اوپن</button></div>
        <div class="see-all-container"><a href="#" class="see-all-btn">→</a></div>
    </div>
</section>

<section class="section">
    <h3>پریمیم ایپس / Premium Apps</h3>
    <div class="scroll-container">
        <div class="card"><img src="https://via.placeholder.com/130x150" alt="App"><h4>CapCut</h4><button class="btn btn-down">ڈاؤن لوڈ</button></div>
        <div class="card"><img src="https://via.placeholder.com/130x150" alt="App"><h4>Remini</h4><button class="btn btn-down">ڈاؤن لوڈ</button></div>
        <div class="see-all-container"><a href="#" class="see-all-btn">→</a></div>
    </div>
</section>

<section class="section">
    <h3>پریمیم کورسز / Premium Courses</h3>
    <div class="scroll-container" id="videoGrid"></div>
</section>

<script>
    const videos = ["Llu1GAy_lYE", "R3_keBvmuNk", "szY-yqLj3Fg"];
    const grid = document.getElementById('videoGrid');
    videos.forEach(id => {
        grid.innerHTML += `
            <div class="card">
                <img src="https://img.youtube.com/vi/${id}/mqdefault.jpg">
                <h4>نعت شریف</h4>
                <div style="display:flex; gap:5px;">
                    <button class="btn btn-open" style="font-size:10px;">واچ</button>
                    <button class="btn btn-down" style="font-size:10px;">⬇</button>
                </div>
            </div>`;
    });
    grid.innerHTML += `<div class="see-all-container"><a href="#" class="see-all-btn">→</a></div>`;
</script>

</body>
</html>
