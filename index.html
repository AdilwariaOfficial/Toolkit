<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIL WARIA | Official Hub</title>
    <style>
        :root { --primary-green: #0a3d2e; --accent-gold: #c5a059; --bg-light: #f4f4f4; --bg-dark: #121212; --card-light: #ffffff; --card-dark: #1e1e1e; --text-light: #333; --text-dark: #eee; }
        body.dark-mode { background-color: var(--bg-dark); color: var(--text-dark); }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-light); color: var(--text-light); transition: 0.3s; }

        header, footer { background: var(--primary-green); padding: 15px 5%; color: white; }
        header { border-bottom: 4px solid var(--accent-gold); }
        footer { border-top: 4px solid var(--accent-gold); text-align: center; margin-top: 30px; }
        
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links a { text-decoration: none; color: white; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        .hero { background: var(--primary-green); color: white; padding: 40px 5%; text-align: center; }
        
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px 5%; }
        .card { background: var(--card-light); padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333; }
        body.dark-mode .card { background: var(--card-dark); color: white; }
        
        button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 5px; background: var(--accent-gold); color: white; font-weight: bold; width: 100%; margin-top: 5px; }
        .cat-btn { background: var(--primary-green); margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">🏠 ADIL WARIA</div>
        <div class="nav-links">
            <a href="#">HOME</a><a href="#">ABOUT</a><a href="#">CONTACT</a><a href="#">UPLOAD</a>
        </div>
    </div>
</header>

<section class="hero">
    <h1>ADIL WARIA</h1>
    <p>Open Source Educational Hub</p>
</section>

<section class="grid-4">
    <div class="card">
        <h4>Wifaq-ul-Madaris</h4>
        <button onclick="toggleDisplay('wifaq-menu')">Open</button>
        <div id="wifaq-menu" style="display:none; margin-top:10px;">
            <select style="width:100%; padding:5px;" onchange="showSubButtons(this.value, 'wifaq')">
                <option value="">درجہ منتخب کریں</option>
                <option value="تجوید">تجوید</option><option value="ابتدائیہ">ابتدائیہ</option>
                <option value="اولیٰ">اولیٰ</option><option value="ثانیہ">ثانیہ</option>
                <option value="ثالثہ">ثالثہ</option><option value="رابعہ">رابعہ</option>
                <option value="خامسہ">خامسہ</option><option value="سادسہ">سادسہ</option>
                <option value="سابعہ">سابعہ</option><option value="عالمیہ">عالمیہ</option>
                <option value="تخصص">تخصص</option>
            </select>
            <div id="wifaq-btns" style="display:none;">
                <button class="cat-btn" onclick="location.href='books.html'">نصابی کتب</button>
                <button class="cat-btn" onclick="location.href='books.html'">امدادی کتب</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h4>All Boards</h4>
        <button onclick="toggleDisplay('board-menu')">Open</button>
        <div id="board-menu" style="display:none; margin-top:10px;">
            <select style="width:100%; padding:5px;" onchange="showSubButtons(this.value, 'board')">
                <option value="">کلاس منتخب کریں</option>
                <option value="9th">9th</option><option value="10th">10th</option>
                <option value="11th">11th</option><option value="12th">12th</option>
            </select>
            <div id="board-btns" style="display:none;">
                <button class="cat-btn" onclick="location.href='books.html'">نصابی کتب</button>
                <button class="cat-btn" onclick="location.href='books.html'">امدادی کتب</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h4>AIOU</h4>
        <button onclick="toggleDisplay('aiou-menu')">Open</button>
        <div id="aiou-menu" style="display:none; margin-top:10px;">
            <select style="width:100%; padding:5px;" onchange="showSubButtons(this.value, 'aiou')">
                <option value="">کورس منتخب کریں</option>
                <option value="SSC">میٹرک (SSC)</option><option value="HSSC">انٹر (HSSC)</option>
                <option value="AD">ایسوسی ایٹ ڈگری</option><option value="BS">بی ایس (BS)</option>
                <option value="BEd">بی ایڈ (B.Ed)</option><option value="PGD">PGD</option>
                <option value="MPhil">ایم فل / ایم ایس</option><option value="PhD">پی ایچ ڈی</option>
            </select>
            <div id="aiou-btns" style="display:none;">
                <button class="cat-btn" onclick="location.href='books.html'">نصابی کتب</button>
                <button class="cat-btn" onclick="location.href='books.html'">امدادی کتب</button>
            </div>
        </div>
    </div>
</section>

<script>
    function toggleDisplay(id) {
        let el = document.getElementById(id);
        el.style.display = (el.style.display === "none") ? "block" : "none";
    }
    function showSubButtons(val, prefix) {
        if(val !== "") document.getElementById(prefix + '-btns').style.display = "block";
    }
</script>

<footer>
    &copy; 2026 ADIL WARIA. All Rights Reserved.
</footer>
</body>
</html>
