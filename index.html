<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIL WARIA® | Official</title>
    <style>
        :root { --primary-green: #0a3d2e; --accent-gold: #c5a059; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; }

        header { background: var(--primary-green); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-gold); }
        .logo { font-weight: bold; font-size: 22px; color: white; text-decoration: none; }
        
        .section { padding: 20px 5%; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 18px; }

        .scroll-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .scroll-container::-webkit-scrollbar { display: none; }

        /* کارڈ کا سائز ناموں کے لیے تھوڑا مزید بڑھایا گیا ہے */
        .card { min-width: 150px; background: white; padding: 12px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .card h4 { margin: 5px 0; font-size: 13px; min-height: 35px; }

        .btn-group { display: flex; gap: 5px; margin-top: 8px; }
        .btn { flex: 1; padding: 6px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; text-decoration: none; text-align: center; }
        .btn-gold { background: var(--accent-gold); color: white; }
        .btn-green { background: var(--primary-green); color: white; }

        .see-all { display: flex; align-items: center; justify-content: center; min-width: 60px; background: var(--primary-green); color: white; border-radius: 12px; text-decoration: none; font-size: 24px; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">ADIL WARIA®</a>
    <div style="font-weight:bold; cursor:pointer;">MENU ☰</div>
</header>

<section class="section">
    <div class="section-header"><h2>Library / لائبریری</h2></div>
    <div class="scroll-container">
        <div class="card"><h4>General Library</h4><a href="#" class="btn btn-gold">Open</a></div>
        <div class="card"><h4>وفاق المدارس</h4><a href="#" class="btn btn-gold">Open</a></div>
        <div class="card"><h4>آل بورڈز</h4><a href="#" class="btn btn-gold">Open</a></div>
        <div class="card"><h4>علامہ اقبال اوپن یونیورسٹی</h4><a href="#" class="btn btn-gold">Open</a></div>
        <a href="#" class="see-all">→</a>
    </div>
</section>

<section class="section">
    <div class="section-header"><h2>Digital Tools / ڈیجیٹل ٹولز</h2></div>
    <p style="margin-top:-15px; font-size: 11px; color: #666;">Premium Apps</p>
    <div class="scroll-container">
        <div class="card"><h4>CapCut Pro</h4><a href="#" class="btn btn-green">Visit</a></div>
        <div class="card"><h4>Remini Pro</h4><a href="#" class="btn btn-green">Visit</a></div>
        <a href="#" class="see-all">→</a>
    </div>
</section>

<section class="section">
    <div class="section-header"><h2>Courses / کورسز</h2></div>
    <div class="scroll-container" id="videoGrid"></div>
</section>

<script>
    const videos = ["Llu1GAy_lYE", "R3_keBvmuNk", "szY-yqLj3Fg"];
    const grid = document.getElementById('videoGrid');
    videos.forEach(id => {
        grid.innerHTML += `
            <div class="card">
                <img src="https://img.youtube.com/vi/${id}/mqdefault.jpg">
                <h4>Naat Sharif 2025</h4>
                <div class="btn-group">
                    <a href="#" class="btn btn-gold">WATCH</a>
                    <a href="#" class="btn btn-green">⬇</a>
                </div>
            </div>`;
    });
    grid.innerHTML += `<a href="#" class="see-all">→</a>`;
</script>

</body>
</html>
