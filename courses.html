<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Gallery | Adilwaria Digital Academy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">ADIL<span class="highlight">WARIA</span></a>
            <div class="nav-right-element">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="library.html">Library</a></li>
                    <li><a href="tools.html">Tools</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                </ul>
                <button id="theme-toggle" class="theme-switch-btn"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <section class="library-hero">
        <div class="container text-center">
            <span class="badge">Visual Moments & Events</span>
            <h1 class="brand-title">MEDIA <span class="gradient-text">GALLERY</span></h1>
            <p class="section-subtitle">اکیڈمی کی اہم تقریبات، علمی مجالس اور یادگار لمحات کے تصویری جھلکیاں</p>
        </div>
    </section>

    <main class="container" style="padding-bottom: 60px;">
        <div class="gallery-master-grid">
            <div class="glass-card gallery-card-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=600&auto=format&fit=crop" alt="Academy Event">
                <div class="gallery-img-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>
            <div class="glass-card gallery-card-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=600&auto=format&fit=crop" alt="Digital Learning">
                <div class="gallery-img-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>
            <div class="glass-card gallery-card-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?q=80&w=600&auto=format&fit=crop" alt="Event Schedule">
                <div class="gallery-img-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>
        </div>
    </main>

    <div id="lightbox-modal" class="lightbox-wrapper-modal" onclick="closeLightbox()">
        <span class="close-lightbox-btn">&times;</span>
        <img class="lightbox-content-img" id="lightbox-target-img">
    </div>

    <a href="https://wa.me/923000000000" class="whatsapp-sticky-btn" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <footer>
        <div class="container text-center"><p>&copy; 2026 Adilwaria Digital Academy. All Rights Reserved.</p></div>
    </footer>

    <script>
        // لائیٹ باکس فنکشنز
        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            document.getElementById('lightbox-target-img').src = imgSrc;
            document.getElementById('lightbox-modal').style.display = "flex";
        }
        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = "none";
        }

        // تھیم سوئچ لاجک
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            const icon = themeToggleBtn.querySelector('i');
            if(document.body.classList.contains('dark-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
</body>
</html>
